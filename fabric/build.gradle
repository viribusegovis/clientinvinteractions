plugins {
    id 'fabric-loom' version '1.15.5'
}

version = "${mod_version}+${minecraft_version}"
group = 'com.viribusegovis.clientinvinteractions'

base {
    archivesName = 'clientinvinteractions-fabric'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/clientinvinteractions.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Optional: only supplies the config-screen entrypoint when Mod Menu is installed.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    inputs.property 'version', mod_version
    filesMatching('fabric.mod.json') {
        expand version: mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
