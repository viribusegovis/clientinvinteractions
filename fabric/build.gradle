plugins {
    id 'fabric-loom' version '1.10.5'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

import net.darkhax.curseforgegradle.Constants
import net.darkhax.curseforgegradle.TaskPublishCurseForge

version = "${mod_version}+${minecraft_version}"
group = 'com.viribusegovis.clientinvinteractions'

base {
    archivesName = 'clientinvinteractions-fabric'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/clientinvinteractions.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

processResources {
    inputs.property 'version', mod_version
    filesMatching('fabric.mod.json') {
        expand version: mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Icon at the jar root (fabric.mod.json "icon"); license alongside.
processResources { from('../icon.png') }
jar { from('../LICENSE') }

// Publishing: see the Forge build and ../../PUBLISHING.md. remapJar is the production jar on Fabric.
def changelogText = file('../changelog.md').text

modrinth {
    token = providers.gradleProperty('modrinthToken').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
    projectId = modrinth_project_id
    versionNumber = project.version + '-fabric'
    versionName = "${mod_version} for Fabric ${minecraft_version}"
    versionType = 'release'
    uploadFile = remapJar
    gameVersions = [minecraft_version]
    loaders = ['fabric']
    changelog = changelogText
    dependencies {
        required.project 'fabric-api'
        optional.project 'modmenu'
    }
}
tasks.named('modrinth') { dependsOn tasks.named('build') }

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    dependsOn tasks.named('build')
    apiToken = providers.gradleProperty('curseforgeToken').orElse(providers.environmentVariable('CURSEFORGE_TOKEN')).get()
    def mainFile = upload(curseforge_project_id, remapJar)
    mainFile.displayName = "${mod_version} for Fabric ${minecraft_version}"
    mainFile.releaseType = Constants.RELEASE_TYPE_RELEASE
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogText
    mainFile.addJavaVersion('Java 17')
    mainFile.addGameVersion(minecraft_version)
    mainFile.addEnvironment('Client')
    mainFile.addModLoader('Fabric')
    mainFile.addRequirement('fabric-api')
    mainFile.addOptional('modmenu')
}
