plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+${minecraft_version}"
group = 'com.viribusegovis.clientinvinteractions'

base {
    archivesName = 'clientinvinteractions-fabric'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup('com.terraformersmc') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Optional: only the modmenu entrypoint touches it, and Mod Menu loads that entrypoint itself.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    mods {
        create('clientinvinteractions') {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

processResources {
    inputs.property 'version', mod_version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'fabric_loader_version', fabric_loader_version
    filesMatching('fabric.mod.json') {
        expand version: mod_version, minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
