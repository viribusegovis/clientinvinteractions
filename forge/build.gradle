plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

import net.darkhax.curseforgegradle.Constants
import net.darkhax.curseforgegradle.TaskPublishCurseForge

version = "${mod_version}+${minecraft_version}"
group = 'com.viribusegovis.clientinvinteractions'

base {
    archivesName = 'clientinvinteractions-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                clientinvinteractions {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand version: mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from('../LICENSE')
    finalizedBy 'reobfJar'
}

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

// The icon sits at the jar root, where mods.toml's logoFile points.
processResources { from('../icon.png') }

// Publishing: "./gradlew modrinth publishCurseForge" uploads the reobfuscated jar as a new version.
// Tokens are never stored in this project: they come from ~/.gradle/gradle.properties
// (modrinthToken / curseforgeToken) or the MODRINTH_TOKEN / CURSEFORGE_TOKEN environment variables.
// Modrinth also needs each version's environment set to "Client only", which Minotaur 2.8.7 doesn't
// send: PATCH /v3/version/{id} {"environment":"client_only"} (see ../../PUBLISHING.md).
def changelogText = file('../changelog.md').text

modrinth {
    token = providers.gradleProperty('modrinthToken').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
    projectId = modrinth_project_id
    versionNumber = project.version + '-forge'
    versionName = "${mod_version} for Forge ${minecraft_version}"
    versionType = 'release'
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ['forge']
    changelog = changelogText
    syncBodyFrom = file('../README.md').text
}
tasks.named('modrinth') { dependsOn tasks.named('build') }

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    dependsOn tasks.named('build')
    apiToken = providers.gradleProperty('curseforgeToken').orElse(providers.environmentVariable('CURSEFORGE_TOKEN')).get()
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.displayName = "${mod_version} for Forge ${minecraft_version}"
    mainFile.releaseType = Constants.RELEASE_TYPE_RELEASE
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogText
    mainFile.addJavaVersion('Java 17')
    mainFile.addGameVersion(minecraft_version)
    mainFile.addEnvironment('Client')
    mainFile.addModLoader('Forge')
}
